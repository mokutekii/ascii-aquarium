<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ASCII Aquarium</title><link rel="icon" type="image/png" href="/favicon.png">
<style>
:root{color-scheme:dark;font-family:'Segoe UI',sans-serif;background:#071216;color:#d5e8e7}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:flex;flex-direction:column;--accent:#78c8bd}body[data-mode=working]{--accent:#baa0ee}body[data-mode=done]{--accent:#efca7b}body[data-mode=offline]{--accent:#879393}header{zoom:var(--uz,1);padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{margin:0;font-size:14px;letter-spacing:.03em;font-weight:600}#message{font-size:12px;color:var(--accent);margin-top:5px;transition:color .6s}#splash{color:#a5c8c5;background:transparent;border:0;padding:2px 4px;cursor:pointer;font:inherit;font-size:11px;opacity:.7}#splash:hover{opacity:1;color:#d5e8e7}#tank{min-height:0;flex:1;position:relative;background:radial-gradient(ellipse at 50% 0%,#102c35,#050b10 85%);}canvas{display:block;width:100%;height:100%;font-family:Consolas,'Courier New',monospace}
#status{position:fixed;top:10px;right:14px;z-index:2;zoom:var(--uz,1);display:flex;align-items:center;gap:14px;padding:6px 10px;border-radius:14px;background:rgba(5,11,16,.45);opacity:.5;transition:opacity .3s}#status:hover{opacity:1}#message{display:none}#connection{font-size:9px;letter-spacing:.1em;color:#607b7d}
.ind{--c:#e07b3c;--g:224,123,60;display:flex;align-items:center;gap:7px;font-size:11px;color:#6d8588}#codex{--c:#b48be6;--g:133,91,160}
.ind i{width:9px;height:9px;border-radius:50%;background:var(--c);opacity:.22;transition:opacity .4s,box-shadow .4s}.ind b{font-weight:500;color:inherit}
.ind.active{color:var(--c)}.ind.active i{opacity:1;box-shadow:0 0 6px 2px rgba(var(--g),.85),0 0 16px 5px rgba(var(--g),.45);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 4px 1px rgba(var(--g),.6),0 0 11px 3px rgba(var(--g),.25)}}
@media(prefers-reduced-motion:reduce){.ind.active i{animation:none}}
</style></head><body data-mode="idle"><div id="status"><span id="message" role="status"></span><span id="connection">LOCAL</span><span id="claude" class="ind"><i></i><b>Claude</b></span><span id="codex" class="ind"><i></i><b>Codex</b></span><button id="splash" title="Make a little splash">Splash</button></div><main id="tank"><canvas aria-label="Animated ASCII sharks and schooling fish"></canvas></main><script type="module" src="/aquarium.ts"></script></body></html>
