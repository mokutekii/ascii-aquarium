<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ASCII Aquarium</title><link rel="icon" type="image/png" href="/favicon.png">
<style>
:root{color-scheme:dark;font-family:'Segoe UI',sans-serif;background:#071216;color:#d5e8e7}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:flex;flex-direction:column;--accent:#78c8bd}body[data-mode=working]{--accent:#baa0ee}body[data-mode=done]{--accent:#efca7b}body[data-mode=offline]{--accent:#879393}header{zoom:var(--uz,1);padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{margin:0;font-size:14px;letter-spacing:.03em;font-weight:600}#message{font-size:12px;color:var(--accent);margin-top:5px;transition:color .6s}#opts{color:#a5c8c5;background:transparent;border:0;padding:2px 4px;cursor:pointer;font:inherit;font-size:11px;opacity:.7}#opts:hover{opacity:1;color:#d5e8e7;filter:drop-shadow(0 0 4px rgba(120,200,189,.7))}#opts{display:flex;align-items:center}#opts svg{display:block}#tank{min-height:0;flex:1;position:relative;background:radial-gradient(ellipse at 50% 0%,#102c35,#050b10 85%);}canvas{display:block;width:100%;height:100%;font-family:Consolas,'Courier New',monospace}
#status{position:fixed;top:10px;right:calc(150px / var(--uz,1));z-index:2;zoom:var(--uz,1);display:flex;align-items:center;gap:14px;padding:6px 10px;border-radius:14px;background:rgba(5,11,16,.45);opacity:.5;transition:opacity .3s}#status:hover{opacity:1}#toasts{position:fixed;left:14px;bottom:12px;z-index:3;zoom:var(--uz,1);display:flex;flex-direction:column;gap:3px;pointer-events:none;max-width:min(70vw,420px)}.toast{font-size:12px;line-height:1.35;color:#a5c8c5;text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 9px color-mix(in srgb,currentColor 50%,transparent);display:inline-block;align-self:flex-start}.toast.t-danger{color:#ffc94a}.toast.t-quip{color:#e6dcc4;font-style:italic}.toast.t-alien{color:#9ff0b4}.toast.t-whale{color:#a8c8ff}.toast.t-fire{color:#ff9a3c;font-weight:600}.toast.t-shark{color:#ff8fa3}.toast.t-glow{color:#c4b0ff}.toast.t-good{color:#b4f5c0;font-weight:600}.toast.t-rainbow{text-shadow:none;font-weight:700;letter-spacing:.06em;background:linear-gradient(90deg,#ff6b6b,#ffb86b,#fff36b,#6bff8e,#6bd6ff,#a78bff,#ff6bd6,#ff6b6b);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:aq-rb 1.6s linear infinite}@keyframes aq-rb{to{background-position:-200% 0}}.toast.t-insist{color:#ffd76b;font-style:italic;letter-spacing:.08em;text-shadow:0 0 8px rgba(255,200,90,.55)}.toast.t-event{color:#9fe6ff;letter-spacing:.04em}.t-clash{color:#c27bff}.toast.t-clash{color:#c27bff;font-weight:700;letter-spacing:.06em;text-shadow:0 0 10px rgba(190,100,255,.85),0 1px 3px rgba(0,0,0,.9);animation:aq-boss 2.4s ease-in-out infinite}.t-boss{color:#ff5a4a;font-weight:700;letter-spacing:.06em;text-shadow:0 0 10px rgba(255,40,30,.8),0 1px 3px rgba(0,0,0,.9)}.toast.t-boss{color:#ff5a4a;font-weight:700;letter-spacing:.06em;animation:aq-boss 2.4s ease-in-out infinite}@keyframes aq-boss{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}#message{display:none}#connection{font-size:9px;letter-spacing:.1em;color:#607b7d}
.ind{--c:#e07b3c;--g:224,123,60;display:flex;align-items:center;gap:7px;font-size:11px;color:#6d8588}#codex{--c:#b48be6;--g:133,91,160}
.ind i{width:9px;height:9px;border-radius:50%;background:var(--c);opacity:.22;transition:opacity .4s,box-shadow .4s}.ind b{font-weight:500;color:inherit}
.ind.active{color:var(--c)}.ind.active i{opacity:1;box-shadow:0 0 6px 2px rgba(var(--g),.85),0 0 16px 5px rgba(var(--g),.45);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 4px 1px rgba(var(--g),.6),0 0 11px 3px rgba(var(--g),.25)}}
@media(prefers-reduced-motion:reduce){.ind.active i{animation:none}}
#history{position:fixed;left:14px;bottom:12px;z-index:3;zoom:var(--uz,1);display:none;flex-direction:column;gap:3px;pointer-events:none;max-width:min(70vw,420px)}#history.open{display:flex}body:has(#history.open) #toasts{display:none}#panel{position:fixed;top:44px;right:14px;z-index:3;zoom:var(--uz,1);display:none;flex-direction:column;gap:5px;padding:9px 13px;border-radius:12px;background:rgba(5,11,16,.8);font-size:11px;color:#8fa9ac}#panel.open{display:flex}#panel button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:22px}#panel button:hover{color:#d5e8e7}#panel b{font-weight:500;color:#a5c8c5}
#panel{box-shadow:0 0 18px rgba(120,200,189,.1);border:1px solid rgba(120,200,189,.12);min-width:150px}#panel button:hover b{text-shadow:0 0 6px rgba(120,200,189,.7)}
#event-list{display:none;flex-direction:column;gap:5px;max-height:46vh;overflow:auto;margin-top:3px;padding-top:7px;border-top:1px solid rgba(165,200,197,.12);scrollbar-width:none}#event-list.open{display:flex}
.event-row{display:flex;align-items:center;gap:8px;cursor:pointer}.event-row:hover{color:#d5e8e7}.event-row input{appearance:none;-webkit-appearance:none;width:9px;height:9px;margin:0;border:1px solid #3d5a5e;border-radius:2px;cursor:pointer;flex-shrink:0}.event-row input{position:relative;width:11px;height:11px}.event-row input:checked{border-color:#a9d8d0;box-shadow:0 0 6px rgba(120,200,189,.55)}.event-row input:checked::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:19px;margin:-9.5px 0 0 -1.5px;background:#fff;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);transform:rotate(38deg)}.event-row input:not(:checked)+span{opacity:.45}.event-row input:focus-visible{outline:1px solid #78c8bd;outline-offset:2px}
.t-ghost{color:#8eeaff;font-weight:700;letter-spacing:.065em;text-shadow:0 0 12px rgba(65,185,255,.9),0 0 25px rgba(50,115,255,.45),0 1px 3px #000}.toast.t-ghost{animation:aq-boss 3.6s ease-in-out infinite}
</style></head><body data-mode="idle"><div id="status"><span id="message" role="status"></span><span id="connection">LOCAL</span><span id="claude" class="ind"><i></i><b>Claude</b></span><span id="codex" class="ind"><i></i><b>Codex</b></span><button id="opts" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="m9 3-.6 2.4-2 .9-2.2-.7-2 3.4 1.7 1.7v2.6L2.2 15l2 3.4 2.2-.7 2 .9L9 21h4l.6-2.4 2-.9 2.2.7 2-3.4-1.7-1.7v-2.6L19.8 9l-2-3.4-2.2.7-2-.9L13 3Z" transform="translate(1 0)"/><circle cx="12" cy="12" r="3"/></svg></button></div><div id="panel"><button data-opt="events">pace <b></b></button><button data-opt="night">night <b></b></button><button data-opt="motion">motion <b></b></button><button data-opt="speed">speed <b></b></button><button id="event-toggle">events <b>show</b></button><div id="event-list"></div></div><main id="tank"><canvas aria-label="Animated ASCII sharks and schooling fish"></canvas></main><script type="module" src="/aquarium.ts"></script></body></html>
